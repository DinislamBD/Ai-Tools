name: Bug report
description: Report a reproducible problem without sharing private documents.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open... 2. Click... 3. Observe..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, browser, Node.js version"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have removed personal document data, credentials and secrets.
          required: true
